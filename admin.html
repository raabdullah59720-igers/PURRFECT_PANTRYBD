<!doctype html><html lang="en-BD"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purrfect Pantry Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><p class="eyebrow">Purrfect Pantry · Admin</p><h1>Product pricing</h1><p class="section-intro">Update every product price in BDT. This panel requires the backend admin token.</p><div id="status" class="review-placeholder">Loading…</div><div id="products"></div></div></main><script>const API_BASE=(window.PANTRY_API_BASE||'').replace(/\/$/,'');const token=new URLSearchParams(location.search).get('token')||localStorage.getItem('pp-admin-token')||prompt('Admin token');if(token)localStorage.setItem('pp-admin-token',token);const status=document.getElementById('status');async function api(p,o={}){const r=await fetch(API_BASE+p,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}async function load(){try{const d=await api('/api/admin/products');document.getElementById('products').innerHTML=d.products.map(p=>`<article class="card" style="margin:14px 0"><h3>${p.name}</h3><p>${p.category} · ${p.weight}</p><label>Current price (BDT)<input id="price-${p.id}" type="number" min="0" step="1" value="${p.price}"></label><label>Previous/display price<input id="old-${p.id}" type="number" min="0" step="1" value="${p.old||0}"></label><button class="btn btn-primary" onclick="save('${p.id}')">Update price</button></article>`).join('');status.textContent='Connected · Prices loaded'}catch(e){status.textContent=e.message}}async function save(id){try{await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({price:Number(document.getElementById('price-'+id).value),old:Number(document.getElementById('old-'+id).value)})});status.textContent='Price updated successfully';}catch(e){status.textContent=e.message}}load();</script></body></html>
